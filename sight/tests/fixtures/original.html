<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20260%20300%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3CradialGradient%20id%3D%22bg%22%20cx%3D%2250%25%22%20cy%3D%2238%25%22%20r%3D%2285%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23071C30%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%2255%25%22%20stop-color%3D%22%2304101F%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2302060E%22/%3E%0A%20%20%20%20%3C/radialGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Crect%20width%3D%22260%22%20height%3D%22300%22%20rx%3D%2260%22%20fill%3D%22url%28%23bg%29%22/%3E%0A%20%20%3Cellipse%20cx%3D%22130%22%20cy%3D%22150%22%20rx%3D%22100%22%20ry%3D%22120%22%20fill%3D%22none%22%20stroke%3D%22rgba%28231%2C244%2C255%2C0.85%29%22%20stroke-width%3D%222%22/%3E%0A%20%20%3Cellipse%20cx%3D%22130%22%20cy%3D%22150%22%20rx%3D%22100%22%20ry%3D%22120%22%20fill%3D%22%233CE0FF%22%20opacity%3D%220.05%22/%3E%0A%20%20%3Cellipse%20cx%3D%22130%22%20cy%3D%22150%22%20rx%3D%22100%22%20ry%3D%22120%22%20fill%3D%22none%22%20stroke%3D%22%233CE0FF%22%20stroke-width%3D%2214%22%20stroke-linecap%3D%22round%22%20stroke-dasharray%3D%22620%22%20stroke-dashoffset%3D%22160%22%20transform%3D%22rotate%28-90%20130%20150%29%22%20style%3D%22filter%3Adrop-shadow%280%200%208px%20rgba%28157%2C241%2C255%2C0.8%29%29%20drop-shadow%280%200%2020px%20rgba%2860%2C224%2C255%2C0.35%29%29%22/%3E%0A%20%20%3Ctext%20x%3D%22136%22%20y%3D%22158%22%20text-anchor%3D%22middle%22%20font-family%3D%22%27Avenir%20Next%27%2C%27Futura%27%2C%27Century%20Gothic%27%2C%27Segoe%20UI%27%2Csans-serif%22%20font-size%3D%2230%22%20font-weight%3D%22500%22%20letter-spacing%3D%2212%22%20fill%3D%22%23DCEBF5%22%3ESIGHT%3C/text%3E%0A%3C/svg%3E%0A" type="image/svg+xml">
<style>
/* ==========================================================================
   Jarvis HUD theme — forked from the Jarvis-lineage (Baymax) theme.
   Same CSS-variable/state-machine architecture (classes and anatomy are
   unchanged so every page and the whole state machine keep working), but the
   cream/coral warmth is swapped for a deep-navy HUD: cyan glow, crisp white
   ring outline, scan-line field, geometric type. See docs/JARVIS.md.
   No webfont import: HUD type is a system geometric stack (offline-safe).
   ========================================================================== */

:root {
  /* HUD palette */
  --hud-900: #02060E;             /* near-black edge */
  --hud-800: #04101F;             /* deep navy mid */
  --hud-700: #071C30;             /* navy bloom */
  --cyan: #3CE0FF;                /* primary state: bright cyan */
  --cyan-bright: #9DF1FF;         /* glow core */
  --cyan-deep: #16A8CC;           /* accents, borders, focus */
  --amber: #FFB443;               /* thinking */
  --amber-bright: #FFD48C;
  --teal: #38E6C0;                /* vision state */
  --red: #FF4D5E;                 /* SOS / urgent alert */
  --rust: #E8915A;                /* recoverable error */
  --off: #56758C;                 /* offline: desaturated grey-blue */
  --ink: #DCEBF5;                 /* HUD text (variable name kept: pages use var(--ink)) */
  --ink-dim: #6E8CA3;
  --card: rgba(8, 22, 38, 0.55);  /* translucent dark glass */
  --line: rgba(94, 203, 255, 0.22);
  --state-color: var(--cyan);
  --state-glow: var(--cyan-bright);
  --ring-speed: 6s;
  --font-hud: 'Avenir Next', 'Futura', 'Century Gothic', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--font-hud);
  /* deep navy-to-black radial backdrop */
  background: radial-gradient(ellipse at 50% 32%, var(--hud-700) 0%, var(--hud-800) 52%, var(--hud-900) 100%);
  background-color: var(--hud-900);
  color: var(--ink);
  min-height: 100vh;
}

/* scan-line / wave field: subtle horizontal HUD texture, drifting slowly */
.glow-field {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 38%, rgba(56, 224, 255, 0.07), transparent 42%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(120, 210, 255, 0.028) 3px 4px),
    repeating-linear-gradient(0deg, transparent 0 47px, rgba(120, 210, 255, 0.045) 47px 48px);
  pointer-events: none;
  animation: scandrift 26s linear infinite;
}
@keyframes scandrift { to { background-position: 0 0, 0 48px, 0 96px; } }

/* ---------- Ring (unchanged anatomy; double-ring recipe, cyan HUD) ---------- */
.ring-wrap {
  position: relative;
  width: clamp(200px, 60vw, 260px);
  height: clamp(230px, 68vw, 300px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  font: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}
.ring-wrap.mini { width: 120px; height: 146px; cursor: default; }
.ring-wrap:focus-visible { outline: 3px solid var(--cyan-deep); outline-offset: 8px; border-radius: 50%; }
.ring-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* outer ring: thin, crisp, near-white outline */
.ring-outline { fill: none; stroke: rgba(231, 244, 255, 0.85); stroke-width: 1.4; }

.core-fill {
  fill: var(--state-color);
  opacity: 0.05;
  transition: opacity 0.5s ease, fill 0.5s ease;
}

/* inner ring: thicker glowing cyan arc — same drop-shadow glow, colder color,
   sharper falloff (precise/technical, not warm/soft) */
.ring-glow {
  fill: none;
  stroke: var(--state-color);
  stroke-width: 7;
  stroke-linecap: round;
  filter: drop-shadow(0 0 6px var(--state-glow)) drop-shadow(0 0 16px rgba(60, 224, 255, 0.38));
  stroke-dasharray: 620;
  stroke-dashoffset: 160;
  transform-origin: 130px 150px;
  animation: rotate var(--ring-speed) linear infinite;
  transition: stroke 0.5s ease, filter 0.5s ease, stroke-width 0.3s ease;
}
@keyframes rotate { to { transform: rotate(360deg); } }
@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: 0.04; }
  50% { transform: scale(1.035); opacity: 0.10; }
}

/* ---------- States: same machine, HUD palette, tighter timing ---------- */
.ring-wrap.standby {
  --state-color: var(--cyan); --state-glow: var(--cyan-bright); --ring-speed: 6s;
}
.ring-wrap.standby .core-fill { transform-origin: 130px 150px; animation: breathe 4s ease-in-out infinite; }

.ring-wrap.listening {
  --state-color: var(--cyan); --state-glow: var(--cyan-bright); --ring-speed: 1.9s;
}
.ring-wrap.listening .ring-glow { stroke-width: calc(6px + var(--voice-energy, 0) * 12px); }

.ring-wrap.thinking {
  --state-color: var(--amber); --state-glow: var(--amber-bright); --ring-speed: 0.9s;
}
.ring-wrap.thinking .ring-glow { stroke-dasharray: 90 60; }

.ring-wrap.speaking {
  --state-color: var(--cyan-bright); --state-glow: var(--cyan); --ring-speed: 3.2s;
}
.ring-wrap.speaking .ring-glow { animation: rotate var(--ring-speed) linear infinite, speakpulse 1.2s ease-in-out infinite; }
@keyframes speakpulse { 0%, 100% { stroke-width: 6; } 50% { stroke-width: 10; } }

.ring-wrap.vision {
  --state-color: var(--teal); --state-glow: #8CF5E0; --ring-speed: 4.2s;
}
.ring-wrap.vision .ring-glow { stroke-dasharray: 300 80; }

.ring-wrap.alert {
  --state-color: var(--red); --state-glow: #FF9AA4; --ring-speed: 1s;
}
.ring-wrap.alert .ring-glow { stroke-width: 10; filter: drop-shadow(0 0 10px var(--state-glow)) drop-shadow(0 0 24px rgba(255, 77, 94, 0.5)); }
.ring-wrap.alert .status-pill .dot { animation: blinkfast 0.5s linear infinite; }
.ring-wrap.alert .core-fill { opacity: 0.14; }
@keyframes blinkfast { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

.ring-wrap.offline {
  --state-color: var(--off); --state-glow: #7E9DB4; --ring-speed: 10s;
}
.ring-wrap.offline .ring-glow { stroke-width: 5; stroke-dasharray: 400 120; filter: none; }
.ring-wrap.offline .core-fill { opacity: 0.03; }

.ring-wrap.error {
  --state-color: var(--rust); --state-glow: #F4B98C; --ring-speed: 2.6s;
  animation: shake 0.4s ease-in-out 1;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); }
}

/* voice bars, shown only while listening */
.voice-bars {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
  gap: 5px; height: 34px;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}
.ring-wrap.listening .voice-bars { opacity: 1; transform: translateY(0); }
.ring-wrap:not(.listening) .voice-bars { display: none; }
.voice-bars span {
  width: 4px; border-radius: 3px; background: var(--cyan);
  box-shadow: 0 0 6px rgba(60, 224, 255, 0.6);
  animation: bar 0.9s ease-in-out infinite;
}
.voice-bars span:nth-child(1) { height: 12px; animation-delay: -0.9s; }
.voice-bars span:nth-child(2) { height: 22px; animation-delay: -0.6s; }
.voice-bars span:nth-child(3) { height: 30px; animation-delay: -0.3s; }
.voice-bars span:nth-child(4) { height: 18px; animation-delay: -0.75s; }
.voice-bars span:nth-child(5) { height: 10px; animation-delay: -0.45s; }
@keyframes bar { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

.core-label {
  position: relative; z-index: 2;
  font-size: clamp(17px, 5vw, 22px);
  font-weight: 500; letter-spacing: 9px; text-indent: 9px; /* optical centering with tracking */
  color: var(--ink);
  text-shadow: 0 0 12px rgba(60, 224, 255, 0.35);
  transition: opacity 0.3s ease;
}
.ring-wrap.mini .core-label { font-size: 11px; letter-spacing: 4px; text-indent: 4px; }
.ring-wrap.listening .core-label { opacity: 0; }

.status-pill {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  font-size: 10px; letter-spacing: 3px;
  color: var(--ink-dim);
  display: flex; align-items: center; gap: 6px;
  text-transform: uppercase; font-weight: 600;
  white-space: nowrap;
}
.ring-wrap.mini .status-pill { display: none; }
.status-pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--state-color);
  box-shadow: 0 0 8px var(--state-glow);
  animation: blink 1.6s ease-in-out infinite;
}
@keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

.status-line {
  font-size: 15px; letter-spacing: 0.8px;
  color: var(--ink-dim); font-weight: 500;
  min-height: 20px; text-align: center;
  transition: opacity 0.25s ease;
  max-width: 560px; padding: 0 16px;
}
.transcript-line {
  font-size: 13px; color: var(--ink);
  opacity: 0.75; min-height: 18px; text-align: center;
  font-weight: 600; max-width: 560px; padding: 0 16px;
}
.hint { font-size: 11px; letter-spacing: 0.8px; color: var(--ink-dim); opacity: 0.75; font-weight: 500; }

/* click ripple */
.ripple {
  position: absolute; border-radius: 50%;
  background: var(--state-glow); opacity: 0.4;
  transform: scale(0);
  animation: ripple-anim 0.55s ease-out forwards;
  pointer-events: none;
}
@keyframes ripple-anim { to { transform: scale(1); opacity: 0; } }

/* ---------- Page scaffolding ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; z-index: 20;
}
.wordmark {
  font-weight: 600; letter-spacing: 6px; font-size: 14px; text-transform: uppercase;
  color: var(--ink); text-decoration: none;
  text-shadow: 0 0 10px rgba(60, 224, 255, 0.3);
}
.wordmark em { font-style: normal; color: var(--cyan); }
.topbar .spacer { flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
  color: var(--ink-dim); background: var(--card);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 11px;
}
.chip .semi-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(110, 140, 163, 0.5); }
.chip.on .semi-dot { background: var(--cyan); box-shadow: 0 0 6px var(--cyan-bright); }
.chip.cam.on .semi-dot { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
.chip.warn .semi-dot { background: var(--red); }

.navlink {
  font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
  color: var(--ink-dim); text-decoration: none; padding: 6px 4px;
}
.navlink:hover, .navlink.active { color: var(--cyan); }

/* ---------- Cards / grids — HUD panels: dark glass, thin glowing border ---------- */
.panel { position: relative; z-index: 2; width: min(980px, 100%); margin: 76px auto 40px; padding: 0 18px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 20px;
  backdrop-filter: blur(8px);
  box-shadow: inset 0 0 22px rgba(56, 224, 255, 0.045), 0 0 14px rgba(30, 120, 170, 0.08);
}
.card h3 { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 10px; }
.card .big { font-size: 30px; font-weight: 600; }
.card .muted { color: var(--ink-dim); font-size: 12px; font-weight: 600; }
.card ul { list-style: none; font-size: 13px; font-weight: 600; }
.card li { padding: 5px 0; border-bottom: 1px dashed rgba(94, 203, 255, 0.14); }
.card li:last-child { border-bottom: none; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.field label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.field input[type=text], .field input[type=password], .field input[type=url], .field input[type=number], .field select, .field textarea {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
  background: rgba(4, 16, 31, 0.85); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; outline: none;
}
.field select option { background: var(--hud-800); color: var(--ink); }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(60, 224, 255, 0.16); }
.field .desc { font-size: 11px; color: var(--ink-dim); font-weight: 600; }

.row { display: flex; align-items: center; gap: 12px; }
.row.grow > *:first-child { flex: 1; }

.btn {
  font: inherit; font-weight: 600; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(180deg, rgba(20, 44, 66, 0.9), rgba(9, 25, 43, 0.9));
  border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 18px; cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:hover { box-shadow: 0 0 14px rgba(60, 224, 255, 0.22); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: linear-gradient(180deg, var(--cyan-bright), var(--cyan)); border-color: var(--cyan-deep); color: #032233; text-shadow: none; }
.btn.danger { background: linear-gradient(180deg, #FF7A88, var(--red)); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; }
.btn:focus-visible { outline: 3px solid var(--cyan-deep); outline-offset: 3px; }

/* toggle switch */
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 1; }
.switch .track {
  position: absolute; inset: 0; border-radius: 999px;
  background: rgba(60, 90, 116, 0.55); transition: background 0.25s ease;
}
.switch .track::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: #DCEBF5; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
  transition: left 0.25s ease;
}
.switch input:checked + .track { background: var(--cyan-deep); }
.switch input:checked + .track::after { left: 23px; }
.switch input:focus-visible + .track { outline: 3px solid var(--cyan-deep); outline-offset: 2px; }

input[type=range] { accent-color: var(--cyan); width: 100%; }

/* ---------- Chat ---------- */
.chat-log { display: flex; flex-direction: column; gap: 10px; width: min(560px, 100%); max-height: 38vh; overflow-y: auto; padding: 6px 2px; }
.bubble {
  max-width: 85%; padding: 10px 14px; border-radius: 16px;
  font-size: 14px; font-weight: 600; line-height: 1.45;
  animation: rise 0.22s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.bubble.me { align-self: flex-end; background: rgba(28, 60, 86, 0.7); border: 1px solid rgba(94, 203, 255, 0.18); border-bottom-right-radius: 6px; }
/* NOTE: the assistant bubble keeps the historical class name .bubble.max —
   an internal CSS hook only (renamed nowhere; tests and pages rely on it). */
.bubble.max { align-self: flex-start; background: rgba(6, 18, 32, 0.85); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.bubble .cite { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-dim); margin-top: 5px; }

/* rich replies: code blocks, inline code, bubble actions */
.bubble p { margin: 2px 0; white-space: pre-wrap; }
.bubble code.inline { background: rgba(28, 60, 86, 0.85); border-radius: 6px; padding: 1px 7px; font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 12px; }
.codeblock {
  background: #061019; color: #D4DDE4;
  border: 1px solid rgba(94, 203, 255, 0.14);
  border-radius: 12px; margin: 8px 0; overflow: hidden;
  font-size: 13px; line-height: 1.6;
}
.codeblock .codebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px 6px 14px; background: rgba(94, 203, 255, 0.05);
  border-bottom: 1px solid rgba(94, 203, 255, 0.1);
}
.codeblock .lang {
  font-size: 11.5px; letter-spacing: 0.4px; text-transform: lowercase;
  font-weight: 600; color: #7E9DB4;
  font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
}
.codeblock pre { padding: 12px 14px; overflow-x: auto; }
.codeblock code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
/* syntax tokens (one dark palette, tuned to match the ChatGPT card) */
.tok-k { color: #C586C0; }              /* keywords */
.tok-n { color: #4EC9B0; }              /* numbers */
.tok-c { color: #6A9955; }              /* comments */
.tok-s { color: #CE9178; }              /* strings */
.tok-p { color: #C586C0; }              /* preprocessor / decorators */
.tok-f { color: #DCDCAA; }              /* function calls */
.copy-btn {
  color: #7E9DB4;
  background: transparent; border: none;
  border-radius: 8px; width: 28px; height: 28px; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.15s ease, color 0.15s ease;
}
.copy-btn:hover { background: rgba(94, 203, 255, 0.12); color: var(--cyan-bright); }
.bubble-actions { display: flex; gap: 6px; margin-top: 7px; }
.mini-btn {
  color: var(--ink-dim); background: transparent;
  border: 1px solid var(--line); border-radius: 8px;
  width: 24px; height: 24px; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.mini-btn:hover { color: var(--cyan); border-color: var(--cyan-deep); }
.copy-btn svg, .mini-btn svg { width: 14px; height: 14px; display: block; flex: none; }
.copy-btn.done { color: #6FD6A8; }
.mini-btn.done { border-color: #6FD6A8; color: #6FD6A8; }
html[data-contrast='high'] .codeblock { background: #000; }
html[data-contrast='high'] .mini-btn { color: #9FC3DB; border-color: #9FC3DB; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: rgba(6, 18, 32, 0.95); color: var(--ink);
  border: 1px solid var(--line);
  padding: 12px 18px; border-radius: 14px; font-size: 13px; font-weight: 600;
  display: flex; gap: 12px; align-items: center; z-index: 60;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 18px rgba(60, 224, 255, 0.1);
  animation: rise 0.3s ease both; max-width: min(92vw, 480px);
}
.toast .btn { padding: 6px 12px; font-size: 10px; }

.video-stage {
  width: 100%; border-radius: 14px; background: #04101F;
  border: 1px solid var(--line);
  aspect-ratio: 4/3; object-fit: cover; display: block;
}

<script>
/* original js/common.js */
/* Jarvis — shared client helpers (all pages). */
window.Jarvis = window.MAX = (() => {
  const existing = window.Jarvis || window.MAX || {};
  if (existing.api && existing.LS) return existing;
  const LS = {
    get: (k, d = null) => { try { const v = JSON.parse(localStorage.getItem('max.' + k)); return v ?? d; } catch { return d; } },
    set: (k, v) => localStorage.setItem('max.' + k, JSON.stringify(v)),
  };

  const user = () => LS.get('user', 'default');
  const token = () => LS.get('token', '');

  async function api(path, method = 'GET', body, options = {}) {
    const res = await fetch(path, {
      signal: options.signal, method,
      headers: { ...(token() ? { authorization: 'Bearer ' + token() } : {}), ...(body ? { 'content-type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    return data;
  }
  async function reviewedPost(path,args={}) {
    const review=await api('/api/actions/prepare','POST',{path,args});
    if(!window.confirm(review.summary+'\n\n'+JSON.stringify(review.args)))return null;
    return api(path,'POST',{...review.args,actionApproval:review.approvalId});
  }
  const get = (path) => api(path);
  const post = (path, body = {}) => api(path, 'POST', body);

  async function wsUrl(path) {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const grant=await post('/api/access/ticket',{user:user()});
    return `${proto}://${location.host}${path}?ticket=${encodeURIComponent(grant.ticket)}`;
  }

  function applyPrefs() {
    const html = document.documentElement;
    if (LS.get('highContrast', false)) html.dataset.contrast = 'high';
    if (LS.get('reducedMotion', false)) html.dataset.motion = 'reduced';
  }

  /* ---- TTS (device voices; "Jarvis" default picked in Settings) ---- */
  let voices = [];
  function loadVoices() { voices = ('speechSynthesis' in window && window.speechSynthesis) ? window.speechSynthesis.getVoices() : []; }
  if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

  let speechStatusCache = null, speechStatusAt = 0, activeSpeech = null;
  async function speechStatus(force = false) {
    if (!force && speechStatusCache && Date.now() - speechStatusAt < 15000) return speechStatusCache;
    speechStatusCache = await get('/api/speech'); speechStatusAt = Date.now(); return speechStatusCache;
  }
  function voiceEvent(detail) { window.dispatchEvent(new CustomEvent('jarvis-speech', { detail })); }
  function stopSpeaking() {
    const previous = activeSpeech; activeSpeech = null;
    if (previous) { previous.controller.abort(); previous.audio?.pause(); previous.finish(); }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  async function speak(text, { onstart, onend, pacing } = {}) {
    stopSpeaking();
    let ended = false, started = false, deviceStarted = false;
    const current = { controller: new AbortController(), audio: null, url: null,
      finish() { if (ended) return; ended = true; if (current.url) URL.revokeObjectURL(current.url); if (activeSpeech === current) activeSpeech = null; onend?.(); },
      start() { if (!started && !ended) { started = true; onstart?.(); } } };
    activeSpeech = current;
    if (LS.get('textOnly', false) || !String(text || '').trim()) { current.finish(); return; }
    current.start();
    try {
      const status = await speechStatus();
      if (activeSpeech !== current) return;
      if (status.tts.mode === 'cloud') {
        if (!status.tts.configured) throw new Error('Gemini speech is not configured');
        const result = await api('/api/speech/synthesize', 'POST', { text: String(text), calm: pacing === 'calm', user: user() }, { signal: current.controller.signal });
        if (activeSpeech !== current) return;
        const bytes = Uint8Array.from(atob(result.audio), c => c.charCodeAt(0));
        current.url = URL.createObjectURL(new Blob([bytes], { type: result.mimeType }));
        current.audio = new Audio(current.url);
        current.audio.onended = current.finish;
        current.audio.onerror = () => { if (activeSpeech === current) { voiceEvent({ fallback: 'device', reason: 'Cloud audio could not play' }); deviceSpeak(); } };
        if (LS.get('speaker', '') && current.audio.setSinkId) await current.audio.setSinkId(LS.get('speaker'));
        await current.audio.play(); return;
      }
    } catch (error) {
      if (activeSpeech !== current || current.controller.signal.aborted) return;
      voiceEvent({ fallback: 'device', reason: error.message });
    }
    if (activeSpeech === current) deviceSpeak();
    function deviceSpeak() {
      if (activeSpeech !== current || ended || deviceStarted) return;
      deviceStarted = true;
      current.audio?.pause();
      if (!('speechSynthesis' in window)) { voiceEvent({ fallback: 'text', reason: 'Speech playback is unavailable in this browser' }); current.finish(); return; }
      loadVoices();
    const u = new SpeechSynthesisUtterance(text);
    const wanted = LS.get('voice', '');
    const v = voices.find((x) => x.name === wanted) ||
      voices.find((x) => /en[-_]GB/i.test(x.lang) && /george|ryan|male|daniel/i.test(x.name) && !/female/i.test(x.name)) ||
      voices.find((x) => /en[-_]GB/i.test(x.lang)) ||
      voices.find((x) => /en[-_]/i.test(x.lang)) || voices[0];
    if (v) u.voice = v;
    const base = LS.get('rate', 1);
    u.rate = pacing === 'calm' ? Math.max(0.7, base - 0.2) : base;
    u.pitch = LS.get('pitch', 1);
    u.onstart = current.start;
    u.onend = current.finish;
    u.onerror = current.finish;
    speechSynthesis.speak(u);
    }
  }

  async function notify(title, body) {
    if (LS.get('notifications', false) && 'Notification' in window) {
      if (Notification.permission === 'granted') new Notification(title, { body });
      else if (Notification.permission !== 'denied') await Notification.requestPermission();
    }
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  /* ---- drop-in brand assets: assets/logo.* and assets/background.* are used
     automatically when present on the hub; defaults remain when absent. ---- */
  function applyCustomAssets() {
    const wordmark = document.querySelector('.wordmark');
    if (wordmark) {
      const img = new Image();
      img.onload = () => {
        img.alt = 'SIGHT';
        img.style.cssText = 'height:30px;width:auto;display:block';
        wordmark.textContent = '';
        wordmark.appendChild(img);
      };
      img.src = '/assets/logo.png?ts=' + Date.now();
    }
    const bg = new Image();
    bg.onload = () => {
      const st = document.createElement('style');
      st.textContent = 'body::before{content:"";position:fixed;inset:0;z-index:0;background:url(/assets/background.png) center/cover fixed no-repeat;opacity:.35;pointer-events:none}';
      document.head.appendChild(st);
    };
    bg.src = '/assets/background.png?ts=' + Date.now();
  }

  applyPrefs();
  applyCustomAssets();

  Object.assign(existing, { LS, user, token, api, get, post, reviewedPost, wsUrl, speak, stopSpeaking, speechStatus, notify, applyPrefs });
  Object.defineProperty(existing, 'voices', { configurable: true, get() { loadVoices(); return voices; } });
  return existing;
})();

</script>
<script>
/* original js/wakeword.js */
/* Wake-word matcher (shared between the web client and the Node test suite).
   SIGHT: "SIGHT" is the primary trigger; bare "hey"/"hi"/"hello" also
   wake — but ONLY when the greeting is the whole short utterance, so
   conversation full of "hey, about that…" doesn't false-trigger (sensitivity
   tuning). The MAX AI fork keeps "max" as its trigger; this fork does NOT
   wake on "max" — the two products are independent from here on. */
(function (root, factory) {
  const m = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = m;
  else root.WakeWord = m;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  function match(text) {
    const said = String(text || '').toLowerCase().replace(/\s+/g, ' ').trim();
    if (!said) return { wake: false };
    // primary trigger: the assistant's name, alone or with a greeting prefix
    if (/(^|\s)(hey|okay|ok|hi|hello|yo)\s+sight\b/.test(said) || /(^|\s)sight\b/.test(said)) return { wake: true, kind: 'name' };
    // catch-all greeting: only a bare, short greeting — nothing tacked on
    if (/^(hey|hi|hello)[\s.!]*$/.test(said) && said.length <= 12) return { wake: true, kind: 'greeting' };
    return { wake: false };
  }
  return { match };
});

</script>
<script>
/* original js/widgets.js */
/* Jarvis HUD widget layer (shared). Mounts compact glass panels around the
   ring on the main page; the same panel style renders inside Jarvis Remote.
   Pure additive client layer — every read goes through existing public APIs
   (weather / home devices / activity / health); nothing new is exposed, no
   hub logic changes. Widgets degrade to a quiet "hub offline" note and
   recover on the next tick.

   Usage: <div class="hud-widget tl" data-widget="weather"></div>
          MAX.widgets.mountAll();   // scans [data-widget]
*/
window.MAX = window.MAX || {};
MAX.widgets = (() => {
  'use strict';
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const relTime = (ts) => {
    const d = Math.max(0, Date.now() - ts);
    return d < 60e3 ? 'now' : d < 3600e3 ? Math.round(d / 60e3) + 'm' : d < 86400e3 ? Math.round(d / 3600e3) + 'h' : new Date(ts).toLocaleDateString();
  };
  const offline = (el, note) => { el.innerHTML = `<div class="hud-empty">${note || 'hub offline — retrying…'}</div>`; };

  /* ---- date & time (fully local — no hub needed) ---- */
  function clock(el) {
    const paint = () => {
      const n = new Date();
      el.innerHTML =
        `<div class="hud-clock">${esc(n.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }))}</div>` +
        `<div class="hud-sub">${esc(n.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }))}</div>`;
    };
    paint();
    return setInterval(paint, 1000);
  }

  /* ---- weather (current conditions + short outlook) ---- */
  function weather(el) {
    const load = () => MAX.get('/api/weather').then((w) => {
      if (w.configured === false || w.available === false) { offline(el, 'Set your home city in Settings'); return; }
      el.innerHTML =
        `<div class="hud-big">${esc(w.tempC)}<span class="unit">°C</span></div>` +
        `<div class="hud-sub">${esc(w.desc)} · feels ${esc(w.feelsC)}° · H ${esc(w.highC)}° / L ${esc(w.lowC)}°</div>` +
        `<div class="hud-sub">rain ${esc(w.rainPct)}% · wind ${esc(w.windKph)} km/h · ${esc(w.city)}</div>`;
    }).catch(() => offline(el));
    load();
    return setInterval(load, 120000);
  }

  /* ---- quick devices: at-a-glance on/off, tap-to-toggle -------------------
     Taps route through the FULL voice pipeline (/api/utterance), so
     voice-gated devices (locks/garage) stay gated — same trust path as the
     Home card in Jarvis Remote. ---- */
  function devices(el) {
    async function load() {
      try {
        const h = await MAX.get('/api/home/devices');
        if (!h.configured) { offline(el, 'no smart home configured — Settings → Smart home'); return; }
        if (h.error) { offline(el, 'HA: ' + esc(h.error)); return; }
        if (!h.devices.length) { offline(el, 'no lights/fans/plugs found'); return; }
        el.innerHTML = '<ul>' + h.devices.slice(0, 6).map((d) =>
          `<li><span class="hud-label">${esc(d.name)}</span>` +
          `<button class="hud-dotbtn ${d.state === 'on' ? 'on' : ''}" data-id="${esc(d.id)}" data-on="${d.state === 'on' ? 1 : 0}">${esc(d.state)}</button></li>`
        ).join('') + '</ul>';
        el.querySelectorAll('button').forEach((b) => {
          b.onclick = async () => {
            b.disabled = true;
            try {
              const name = b.closest('li').querySelector('.hud-label').textContent;
              const r = await MAX.post('/api/utterance', { user: MAX.user(), text: (b.dataset.on === '1' ? 'turn off ' : 'turn on ') + name });
              if (r && r.verify) {
                const row = b.closest('li').querySelector('.hud-label');
                row.innerHTML = `${esc(name)} <span class="hud-flag">voice-gated</span>`;
              }
              setTimeout(load, 1200);
            } catch { } finally { b.disabled = false; }
          };
        });
      } catch { offline(el); }
    }
    load();
    return setInterval(load, 60000);
  }

  /* ---- notification / activity feed ----------------------------------------
     Reuses the Jarvis Remote activity feed data (/api/activity — sanitized,
     transcript-free). Entries that usually mean "needs the owner" (attention
     flags, security events, integration failures) get a NEEDS YOU chip.
     NOTE: parked voice confirmations live in hub RAM only by design
     (BUG_BACKLOG L-02) — they surface here once resolved, not while parked. */
  const ACT_ICON = { interaction: '💬', 'schedule.fired': '⏰', notify: '🔔', attention: '❗', 'security.lockdown': '🔒', 'security.denied': '🚫', 'satellite.swap': '🛰', 'llm.key.fail': '🔑', 'sos.triggered': '🆘', 'injection.guard': '🛡', 'voiceprint.enrolled': '🎙', 'learn.rerank': '🧠', 'gh.write': '🐙' };
  const FLAG_TYPES = new Set(['attention', 'security.lockdown', 'security.denied', 'llm.key.fail', 'sos.triggered', 'injection.guard']);
  const actLabel = (e) => e.message || (e.skill ? (e.ok === false ? e.skill + ' slipped' : e.skill + ' handled a request') : e.type);
  function activity(el) {
    const load = () => MAX.get('/api/activity?n=8').then((r) => {
      const items = r.items || [];
      el.innerHTML = items.length ? '<ul>' + items.map((e) =>
        `<li><span aria-hidden="true">${ACT_ICON[e.type] || '·'}</span>` +
        `<span class="hud-label">${esc(actLabel(e))}</span>` +
        (FLAG_TYPES.has(e.type) ? '<span class="hud-flag">needs you</span>' : '') +
        `<span class="hud-ago">${relTime(e.ts)}</span></li>`
      ).join('') + '</ul>' : '<div class="hud-empty">quiet so far — activity appears here</div>';
    }).catch(() => offline(el));
    load();
    return setInterval(load, 12000);
  }

  const RENDERERS = { clock, weather, devices, activity };
  let timers = [];

  function mountAll(root) {
    (root || document).querySelectorAll('[data-widget]').forEach((el) => {
      const kind = el.dataset.widget;
      const fn = RENDERERS[kind];
      if (!fn || el._hudMounted) return;
      el._hudMounted = true;
      if (!el.querySelector('h4')) {
        const h = document.createElement('h4');
        h.textContent = { clock: 'Time', weather: 'Weather', devices: 'Devices', activity: 'Activity' }[kind] || kind;
        el.insertBefore(h, el.firstChild);
      }
      const body = document.createElement('div');
      el.appendChild(body);
      timers.push(fn(body));
    });
  }

  /* pause polling while the tab is hidden, resume fresh on return */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { timers.forEach(clearInterval); timers = []; document.querySelectorAll('[data-widget]').forEach((el) => { el._hudMounted = false; }); }
    else { document.querySelectorAll('[data-widget]').forEach((el) => { el.innerHTML = ''; }); mountAll(); }
  });

  return { mountAll };
})();

</script>
<script>
/* original js/voice2.js */
/* Jarvis Voice 2.0 (upgrade §19) — additive client voice layer.
   Extends the existing pipeline (wakeword.js + Web Speech + Jarvis.speak):
     - low-latency VAD (AnalyserNode energy gate; start/stop speech fast)
     - barge-in: the moment VAD hears speech while TTS is playing, Jarvis
       STOPS SPEAKING (Jarvis.stopSpeaking) so the user can interrupt
     - microphone selection (enumerateDevices) + speaker selection (setSinkId
       where supported; honest fallback message where not)
     - noise handling: noise-floor tracking + adaptive threshold
     - conversational fillers (opt-in, only during real latency gaps)
   English + Hinglish: utterances pass through untouched (code-mixing natural);
   TTS voice preference supports en-IN / hi-IN alongside en-US.
   Privacy: microphone is NEVER opened before explicit user action. */
window.Voice2 = (() => {
  let audioCtx = null, analyser = null, micStream = null, sourceNode = null;
  let noiseFloor = 0.012, speaking = false, listening = false;
  let vadCb = null, rafId = 0, lastVoiceTs = 0, generation = 0;

  async function listMics() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
    const devs = await navigator.mediaDevices.enumerateDevices();
    return devs.filter((d) => d.kind === 'audioinput').map((d) => ({ id: d.deviceId, label: d.label || 'microphone' }));
  }

  async function listSpeakers() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
    const devs = await navigator.mediaDevices.enumerateDevices();
    return devs.filter((d) => d.kind === 'audiooutput').map((d) => ({ id: d.deviceId, label: d.label || 'speaker' }));
  }

  /* ---- VAD ---- */
  async function startVAD({ deviceId = null, onSpeech, onSilence } = {}) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return { ok: false, reason: 'getUserMedia unavailable (needs https or localhost + permission)' };
    }
    stopVAD(); const current = generation;
    try {
      const acquired = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: deviceId ? { exact: deviceId } : undefined, echoCancellation: true, noiseSuppression: true },
      });
      if (current !== generation) { acquired.getTracks().forEach(t => t.stop()); return {ok:false,reason:"Microphone cancelled"}; }
      micStream = acquired;
    } catch (e) {
      return { ok: false, reason: 'microphone permission denied or unavailable: ' + e.name };
    }
    try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    sourceNode.connect(analyser);

    vadCb = { onSpeech, onSilence };
    listening = true;
    } catch (error) { stopVAD(); return {ok:false,reason:error.message}; }

    const buf = new Uint8Array(analyser.fftSize);
    const tick = () => {
      if (!listening) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      window.dispatchEvent(new CustomEvent("jarvis-audio-level", {detail:{rms}}));
      noiseFloor = noiseFloor * 0.98 + Math.min(rms, 0.05) * 0.02; // slow floor track
      const threshold = noiseFloor * 2.6 + 0.01;
      const voice = rms > threshold;
      if (voice) {
        lastVoiceTs = Date.now();
        if (!Voice2._inSpeech) {
          Voice2._inSpeech = true;
          /* ---- BARGE-IN: user started talking over TTS → stop TTS immediately ---- */
          if (speaking && window.Jarvis && Jarvis.stopSpeaking) {
            Jarvis.stopSpeaking();
            speaking = false;
            Voice2.onBargeIn && Voice2.onBargeIn();
          }
          vadCb && vadCb.onSpeech && vadCb.onSpeech({ rms });
        }
      } else if (Voice2._inSpeech && Date.now() - lastVoiceTs > 450) {
        Voice2._inSpeech = false;
        vadCb && vadCb.onSilence && vadCb.onSilence({ quietMs: Date.now() - lastVoiceTs });
      }
      rafId = requestAnimationFrame(tick);
    };
    tick();
    return { ok: true, deviceId: deviceId || 'default' };
  }

  function stopVAD() {
    generation++; listening = false; speaking = false; Voice2._inSpeech = false; vadCb = null;
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    if (rafId) cancelAnimationFrame(rafId);
    try { micStream && micStream.getTracks().forEach((t) => t.stop()); } catch {}
    micStream = null; analyser = null; sourceNode = null;
    return { ok: true };
  }

  /* ---- barge-in-aware speak wrapper (marks TTS busy so VAD can cut it) ---- */
  function speak(text, opts = {}) {
    speaking = true;
    const wrapped = {
      ...opts,
      onstart: () => { speaking = true; opts.onstart && opts.onstart(); },
      onend: () => { speaking = false; opts.onend && opts.onend(); },
    };
    if (window.Jarvis && Jarvis.speak) return Jarvis.speak(text, wrapped);
  }

  /* ---- speaker selection (where the browser supports output routing) ---- */
  async function selectSpeaker(el, deviceId) {
    if (el && typeof el.setSinkId === 'function') {
      try { await el.setSinkId(deviceId); return { ok: true }; }
      catch (e) { return { ok: false, reason: e.message }; }
    }
    return { ok: false, reason: 'this browser cannot route audio output (setSinkId unsupported) — using the system default' };
  }

  /* ---- fillers: only during real latency gaps, never fake chatter ---- */
  const FILLERS = {
    en: ['One moment.', 'Let me check that.', 'Hmm — looking into it.'],
    hinglish: ['Ek second.', 'Ruko, dekh raha hoon.', 'Haan, bas ek minute.'],
  };
  let fillerTimer = 0;
  function armFiller(delayMs = 1400, { lang = 'en', onFiller } = {}) {
    clearTimeout(fillerTimer);
    fillerTimer = setTimeout(() => {
      const pool = lang === 'hinglish' ? FILLERS.hinglesh || FILLERS.hinglish : FILLERS.en;
      const f = pool[Math.floor(Math.random() * pool.length)];
      onFiller && onFiller(f);
    }, delayMs);
  }
  function cancelFiller() { clearTimeout(fillerTimer); }

  /* Voice preference helper: supports English + Hinglish natural mixing. */
  function pickVoice(voices, { lang = 'en-US' } = {}) {
    const want = [
      lang === 'en-IN' || lang === 'hi-IN' ? /en[-_]IN|hi[-_]IN|hi-IN|Neerja|Hindi/i : null,
      lang === 'hi-IN' ? /hi[-_]IN|Hindi/i : null,
      /en[-_]/i,
    ].filter(Boolean);
    for (const re of want) {
      const v = voices.find((x) => re.test(x.lang + ' ' + x.name));
      if (v) return v;
    }
    return voices[0] || null;
  }

  return {
    listMics, listSpeakers, startVAD, stopVAD, speak, selectSpeaker,
    armFiller, cancelFiller, pickVoice,
    get isSpeaking() { return speaking; },
    get isListening() { return listening; },
    _inSpeech: false,
    onBargeIn: null, // hook: UI flash "interrupted"
  };
})();

</script>
<script>
/* original js/speech-capture.js */
/* A bounded, user-started microphone recording. No background capture or storage. */
window.SpeechCapture = (() => {
  let session = null;
  async function start({ onText, onError, onStop, onStart, deviceId } = {}) {
    if (session) return { ok: false, reason: 'Microphone is already active' };
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return { ok: false, reason: 'Audio recording is unavailable in this browser' };
    const item = { cancelled: false, controller: new AbortController(), chunks: [], bytes: 0, timer: null, stream: null, recorder: null };
    session = item;
    const cleanup = () => { clearTimeout(item.timer); item.stream?.getTracks().forEach(t => t.stop()); if (session === item) session = null; };
    try {
      item.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, ...(deviceId ? { deviceId: { exact: deviceId } } : {}) } });
      if (item.cancelled) { cleanup(); return { ok: false, reason: 'Recording cancelled' }; }
      const mimeType = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4'].find(type => MediaRecorder.isTypeSupported(type));
      if (!mimeType) throw new Error('No supported recording format');
      item.recorder = new MediaRecorder(item.stream, { mimeType, audioBitsPerSecond: 64000 });
      item.recorder.ondataavailable = event => {
        item.bytes += event.data.size;
        if (item.bytes > 4 * 1024 * 1024) { cancel(); onError?.('Recording exceeded the audio limit'); return; }
        if (event.data.size) item.chunks.push(event.data);
      };
      item.recorder.onerror = () => { cancel(); onError?.('The microphone recording failed'); };
      item.recorder.onstop = async () => {
        clearTimeout(item.timer); item.stream?.getTracks().forEach(t => t.stop());
        if (item.cancelled) { cleanup(); return; }
        onStop?.();
        try {
          if (!item.bytes) throw new Error('No audio was recorded');
          const blob = new Blob(item.chunks, { type: mimeType });
          const audio = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = () => reject(new Error('Audio could not be read')); reader.readAsDataURL(blob); });
          if (item.cancelled) return;
          const result = await Jarvis.api('/api/speech/transcribe', 'POST', { audio, mimeType, user: Jarvis.user() }, { signal: item.controller.signal });
          if (!item.cancelled) onText?.(result.text);
        } catch (error) { if (!item.cancelled) onError?.(error.message); }
        finally { cleanup(); }
      };
      item.recorder.start(250); item.timer = setTimeout(stop, 20000); onStart?.(); return { ok: true };
    } catch (error) { cleanup(); return { ok: false, reason: error.message }; }
  }
  function stop() { if (session?.recorder?.state === 'recording') session.recorder.stop(); }
  function cancel() { const item = session; if (!item) return; item.cancelled = true; item.controller.abort(); clearTimeout(item.timer); stop(); item.stream?.getTracks().forEach(t => t.stop()); session = null; }
  window.addEventListener('pagehide', cancel);
  return { start, stop, cancel, get active() { return !!session; } };
})();

</script>
<script>
/* original js/breadcrumbs.js */
/* Live action breadcrumbs (upgrade §22) — concise step trail only.
   "SIGHT → Opening browser → Searching → Reading results → … → Done"
   NEVER hidden chain-of-thought: the hub streams action labels (what tool is
   running), not reasoning. Renders into #action-trail when present. */
(function () {
  const MAX_STEPS = 8;
  const chains = new Map(); // taskId -> steps[]

  function render(taskId) {
    const el = document.getElementById('action-trail');
    if (!el) return;
    const steps = chains.get(taskId) || [];
    el.textContent = '';
    const parts = ['SIGHT', ...steps.slice(-MAX_STEPS)];
    parts.forEach((p, i) => {
      const s = document.createElement('span');
      s.className = 'crumb' + (i === parts.length - 1 ? ' crumb-live' : '');
      s.textContent = p;
      el.appendChild(s);
      if (i < parts.length - 1) {
        const arrow = document.createElement('span');
        arrow.className = 'crumb-arrow';
        arrow.textContent = '→';
        el.appendChild(arrow);
      }
    });
    el.hidden = false;
    clearTimeout(el._fade);
    el._fade = setTimeout(() => { el.hidden = true; chains.delete(taskId); }, 12000);
  }

  window.Crumbs = {
    push(taskId, step) {
      if (!chains.has(taskId)) chains.set(taskId, []);
      chains.get(taskId).push(String(step).slice(0, 60));
      render(taskId);
    },
    done(taskId) {
      this.push(taskId, 'Done');
    },
  };

  // wire into the shared WS feed (events broadcast by core/observe)
  document.addEventListener('DOMContentLoaded', async () => {
    if (!window.Jarvis || !Jarvis.wsUrl) return;
    try {
      const ws = new WebSocket(await Jarvis.wsUrl('/ws/app'));
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'breadcrumb' && m.step) Crumbs.push(m.task || 'live', m.step);
        if (m.type === 'task' && m.phase === 'end') Crumbs.done(m.id || 'live');
      };
    } catch { /* feed is best-effort */ }
  });
})();

</script>
<script>
(() => {
  const speak = (...args) => Voice2.speak(...args), stopSpeaking = MAX.stopSpeaking;
  const ringWrap = document.getElementById('ringWrap');
  const statusText = document.getElementById('statusText');
  const statusLine = document.getElementById('statusLine');
  const transcriptLine = document.getElementById('transcriptLine');
  const hubChip = document.getElementById('hubChip');
  const hubChipText = document.getElementById('hubChipText');
  const micChip = document.getElementById('micChip');
  const camChip = document.getElementById('camChip');

  /* ---------- extended state machine ---------- */
  const ALL = ['standby','listening','thinking','speaking','vision','alert','offline','error'];
  const STATES = {
    standby:   { pill: 'STANDBY',   line: 'All systems nominal.' },
    listening: { pill: 'LISTENING', line: "I'm listening…" },
    thinking:  { pill: 'THINKING',  line: 'Let me think about that…' },
    speaking:  { pill: 'SPEAKING',  line: '' },
    vision:    { pill: 'VISION',    line: 'Camera is on. Watching for gestures.' },
    alert:     { pill: 'ALERT',     line: 'Emergency alert active.' },
    offline:   { pill: 'OFFLINE',   line: 'Hub unreachable — local fallback only.' },
    error:     { pill: 'ERROR',     line: 'Something slipped — one moment.' },
  };
  /* Jarvis persona: in the Jarvis fork this IS the product voice — on unless
     explicitly switched off in Settings ("Jarvis mode"). */
  if (MAX.LS.get('jarvis', true)) {
    STATES.standby.line = 'At your service.';
    STATES.thinking.line = 'Working on it…';
    STATES.speaking.line = '';
  }
  let state = 'standby';
  let alertActive = false;
  let errorTimer = null;

  function setState(next, lineOverride) {
    ringWrap.classList.remove(...ALL);
    ringWrap.classList.add(next);
    ringWrap.setAttribute('aria-pressed', next === 'listening' ? 'true' : 'false');
    statusText.textContent = STATES[next].pill;
    statusLine.textContent = lineOverride ?? STATES[next].line;
    state = next;
  }
  function flashError(line) {
    clearTimeout(errorTimer);
    setState('error', line || STATES.error.line);
    errorTimer = setTimeout(() => { if (state === 'error') setState('standby'); }, 1600);
  }

  function spawnRipple() {
    const rect = ringWrap.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (rect.width / 2 - size / 2) + 'px';
    ripple.style.top = (rect.height / 2 - size / 2) + 'px';
    ringWrap.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  /* ---------- hub connection ---------- */
  let ws = null, wsOpen = false, reconnectTimer = null;
  let pendingVerifyUtterance = null;
  const taskFromLink = new URLSearchParams(location.search).get('verifyTask');
  let pendingVerifyTask = /^[a-f0-9-]{36}$/.test(taskFromLink||'') ? taskFromLink : null;

  /* Jarvis mode (opt-in, Settings): time-of-day greeting + a status-aware
     first line each session, so "what's blocking what" is heard, not hidden. */
  let jarvisGreeted = false;
  try { jarvisGreeted = sessionStorage.getItem('maxGreeted') === '1'; } catch {}
  function jarvisGreet() {
    if (!MAX.LS.get('jarvis', true) || jarvisGreeted) return;
    jarvisGreeted = true;
    try { sessionStorage.setItem('maxGreeted', '1'); } catch {}
    const h = new Date().getHours();
    const tod = h < 5 ? 'Working late, I see' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    MAX.get('/api/status').then((S) => {
      const needs = (S && S.needs) || [];
      const blocked = needs.filter((n) => n.severity === 'blocked');
      const notes = needs.length - blocked.length;
      let line;
      if (blocked.length) {
        line = `${tod}. ${blocked.length} system${blocked.length > 1 ? 's' : ''} need${blocked.length > 1 ? '' : 's'} attention.`;
        toast(line + ' ' + blocked[0].what, [{ label: 'Open Systems', fn: () => { location.href = 'systems.html'; } }]);
      } else if (notes > 0) {
        line = `${tod}. Operational — ${notes} note${notes > 1 ? 's' : ''} waiting on the Systems page.`;
        toast(line, [{ label: 'Open Systems', fn: () => { location.href = 'systems.html'; } }]);
      } else line = `${tod}. All systems nominal.`;
      if (state === 'standby' || state === 'offline') setState('standby', line);
      speak(line, {});
    }).catch(() => { if (state === 'standby') setState('standby', tod + '.'); });
  }

  /* Daily briefing on first connect of the day (opt-in, Settings → startup briefing). */
  function maybeStartupBriefing() {
    const today = new Date().toISOString().slice(0, 10);
    if (MAX.LS.get('briefedOn', '') === today) return;
    MAX.get('/api/settings').then((st) => {
      if (!st.features || !st.features.startupBriefing) return;
      MAX.LS.set('briefedOn', today);
      setState('thinking');
      sendUtterance('give me my daily briefing');
    }).catch(() => {});
  }

  function hubOnline(online) {
    hubChip.classList.toggle('on', online);
    hubChipText.textContent = online ? 'hub' : 'offline';
    if (!online && state !== 'listening' && !alertActive) setState('offline');
    if (online && state === 'offline') setState('standby', 'Back online. All systems nominal.');
    if (online) { jarvisGreet(); setTimeout(maybeStartupBriefing, 2500); refreshNeeds(); }
    else renderNeeds('off', [OFFLINE_COPY]);
  }

  async function connect() {
    try { ws = new WebSocket(await MAX.wsUrl('/ws/app')); } catch { scheduleReconnect(); return; }
    ws.onopen = () => { wsOpen = true; hubOnline(true); };
    ws.onclose = () => { wsOpen = false; hubOnline(false); scheduleReconnect(); };
    ws.onerror = () => { try { ws.close(); } catch {} };
    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'hello') hubOnline(true);
      else if (msg.type === 'state' && msg.state === 'thinking' && state === 'listening') setState('thinking');
      else if (msg.type === 'response') { clearTimeout(replyWatchdog); handleResponse(msg); }
      else if (msg.type === 'notify') handleNotify(msg);

    const requestId=window.crypto?.randomUUID?window.crypto.randomUUID():'request-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    setState('thinking');
    if (wsOpen) {
      try { ws.send(JSON.stringify({ type: 'utterance', text, ...extra, requestId })); }
      catch { wsOpen = false; } // dead socket — fall through to HTTP
      if (wsOpen) {
        // a half-open socket can swallow the message silently; if no reply
        // arrives, retry once over HTTP so the user is never left hanging
        clearTimeout(replyWatchdog);
        replyWatchdog = setTimeout(() => {
          toast('No reply heard — retrying…');
          MAX.post('/api/utterance', { text, user: MAX.user(), ...extra, requestId })
            .then(handleResponse)
            .catch(() => flashError('Hub unreachable — try again.'));
        }, 15000);
        return;
      }
    }
    try {
      const out = await MAX.post('/api/utterance', { text, user: MAX.user(), ...extra, requestId });

  // === hl:start ===
  /* zero-dependency syntax tinting: escape-then-tokenize, output is always safe HTML.

  function highlightCode(code, lang) {
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const t = String(lang || '').toLowerCase();
    if (t === 'html' || t === 'xml' || t === 'svg' || t === 'markup') {
      return esc(code).replace(/&lt;!--[\s\S]*?--&gt;|"[^"\n]*"|'[^'\n]*'|&lt;\/?[a-zA-Z][\w:-]*|\/?&gt;/g, (m) =>
        m.startsWith('&lt;!--') ? '<span class="tok-c">' + m + '</span>'
          : (m[0] === '"' || m[0] === "'") ? '<span class="tok-s">' + m + '</span>'
            : '<span class="tok-k">' + m + '</span>');
    }
    const C_KW = ('alignas alignof auto bool break case catch char char8_t char16_t char32_t class concept const ' +
      'consteval constexpr constinit const_cast continue co_await co_return co_yield decltype default delete do double ' +
      'dynamic_cast else enum explicit export extern false float for friend goto if inline int long mutable namespace ' +
      'new noexcept nullptr operator private protected public register reinterpret_cast requires restrict return short ' +
      'signed sizeof static static_assert static_cast struct switch template this thread_local throw true try typedef ' +
      'typeid typename union unsigned using virtual void volatile wchar_t while').split(' ');
    const JS_KW = ('async await break case catch class const continue debugger default delete do else export extends ' +
      'finally for from function if import in instanceof let new of return static super switch this throw try typeof ' +
      'undefined var void while with yield true false null get set').split(' ');
    const PY_KW = ('and as assert async await break class continue def del elif else except finally for from global if ' +
      'import in is lambda nonlocal not or pass print raise return try while with yield True False None self').split(' ');
    const SH_KW = ('case do done elif else esac fi for function if in local return select then until while echo export ' +
      'cd source readonly shift set').split(' ');
    const TFN = 'true false null yes no on off'.split(' ');
    const GEN_KW = ('const let var function return if elif else for while do switch case break continue class struct ' +
      'enum new delete void int long float double char bool unsigned signed static public private import from def echo ' +
      'try catch throw in of async await print true false null None True False undefined').split(' ');
    const STR_STD = '"(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'';
    const FAMS = {
      clike: { block: 1, sl: '//', preproc: 1, kw: C_KW, str: STR_STD },
      js: { block: 1, sl: '//', kw: JS_KW, str: STR_STD + '|`[^`]*`' },
      py: { sl: '#', deco: 1, kw: PY_KW, str: '"""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|' + STR_STD },
      sh: { sl: '#', kw: SH_KW, str: STR_STD },
      kv: { sl: '#', kw: TFN, str: STR_STD },
      json: { kw: 'true false null'.split(' '), str: '"(?:[^"\\\\\\n]|\\\\.)*"' },
      css: { block: 1, kw: ['!important'], str: STR_STD, css: 1 },
      generic: { block: 1, sl: '//', kw: GEN_KW, str: STR_STD },
    };
    const ALIAS = {
      c: 'clike', h: 'clike', cpp: 'clike', 'c++': 'clike', cc: 'clike', cxx: 'clike', hpp: 'clike', ino: 'clike', arduino: 'clike',
      js: 'js', mjs: 'js', cjs: 'js', jsx: 'js', ts: 'js', tsx: 'js', javascript: 'js', typescript: 'js',
      py: 'py', python: 'py', sh: 'sh', bash: 'sh', zsh: 'sh', shell: 'sh',
      yaml: 'kv', yml: 'kv', ini: 'kv', toml: 'kv', cfg: 'kv', json: 'json', jsonc: 'js',
      css: 'css', scss: 'css', less: 'css', java: 'clike', cs: 'clike', go: 'clike', rs: 'clike', rust: 'clike',
    };
    const fam = FAMS[ALIAS[t] || 'generic'];
    const pats = [];
    if (fam.block) pats.push(['c', '\\/\\*[\\s\\S]*?\\*\\/']);
    if (fam.sl === '//') pats.push(['c', '\\/\\/[^\\n]*']);
    if (fam.sl === '#') pats.push(['c', '#[^\\n]*']);
    pats.push(['s', fam.str]);
    if (fam.preproc) pats.push(['p', '^[ \\t]*#[^\\n]*']);
    if (fam.deco) pats.push(['p', '@[\\w.]+']);
    if (fam.css) pats.push(['p', '@[a-zA-Z-]+']);
    if (fam.css) pats.push(['n', '#[0-9a-fA-F]{3,8}\\b']);
    if (fam.kw && fam.kw.length) {
      const kw = fam.kw.slice().sort((a, b) => b.length - a.length).join('|');
      pats.push(['k', '\\b(?:' + kw + ')\\b']);
    }
    pats.push(['n', '\\b(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)(?:[fFlLuU]{0,3})\\b']);
    if (fam.css) pats.push(['n', '\\b\\d+(?:\\.\\d+)?(?:px|em|rem|vh|vw|vmin|vmax|%|s|ms|deg|fr|ch)\\b']);
    pats.push(['f', '[A-Za-z_]\\w*(?=\\s*\\()']);
    const re = new RegExp(pats.map((p) => '(' + p[1] + ')').join('|'), 'gm');
    let out = '', last = 0, m;
    const src = String(code);
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      for (let g = 1; g <= pats.length; g++) {
        if (m[g] !== undefined) { out += '<span class="tok-' + pats[g - 1][0] + '">' + esc(m[0]) + '</span>'; break; }
      }
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  function appendCode(container, lang, code) {

  /* rich renderer: fenced blocks → code cards w/ language + copy; prose → paragraphs */
  function renderRich(container, text) {
    const re = /```([a-zA-Z0-9+#.-]*)\n?([\s\S]*?)```/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      const prose = text.slice(last, m.index).trim();
      if (prose) appendProse(container, prose);
      appendCode(container, m[1], m[2].replace(/\n$/, ''));
      last = re.lastIndex;
    }
    const tail = text.slice(last).trim();
    if (tail || !last) appendProse(container, tail);
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function openFullTab() { try { window.open(location.href, '_blank', 'noopener'); } catch {} }
  function flashMicProblem(hint) {
    if (!hint) return;
    if (hint === EMBED_MIC_MSG) toast(hint, [{ label: 'Open full tab ↗', fn: openFullTab }]);

  function micWhyNot(cloud = false) {
    if (!window.isSecureContext) return 'Mic needs a secure page — on this machine open http://localhost:8080 (Chrome blocks mics on http:// network addresses);';
    if (!SR && !cloud) return 'Speech recognition only exists in Chrome/Edge (and it talks to Google servers) — you can type instead;';
    if (inIframe() && micPolicyAllows() === false) return EMBED_MIC_MSG;

      case 'not-allowed':
      case 'service-not-allowed':
        if (inIframe()) return EMBED_MIC_MSG; // iframes often can't even show the allow prompt
        return 'Mic blocked — click the tune/lock icon left of the address bar → allow Microphone → reload.';
      case 'audio-capture': return 'No microphone found — check your input device and that no other app is holding it.';
      case 'network': return 'Chrome\'s speech service is unreachable (it uses Google servers) — check your internet, or type instead.';
      case 'no-speech': return '';

  function startDeviceListening() {
    const why = micWhyNot();
    if (why) { flashMicProblem(why); chatPanel.classList.add('open'); return; }
    if (listening) return;
    stopSpeaking();
    // a running wake-word recognizer holds the mic — park it; it resumes on end
    if (wakeRec) { try { wakeRec.stop(); } catch {} wakeRec = null; }
    rec = new SR();
    const currentRec = rec;
    rec.lang = MAX.LS.get('lang', 'en-US');
    rec.interimResults = true;
    rec.continuous = false;
    listening = true;
    micChip.classList.add('on');
    setState('listening');
    transcriptLine.textContent = '';
    let finalText = '', failed = false, dispatched = false;
    let heardSomething = false;
    let hearWatchdog = null;
    const endUi = () => {
      listening = false;
      micChip.classList.remove('on');
      if (hearWatchdog) { clearTimeout(hearWatchdog); hearWatchdog = null; }
    };
    rec.onresult = (e) => {
      if(rec !== currentRec) return;
      heardSomething = true;
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;

      if (t) { lastUserText = t; addBubble('me', t); setState('thinking'); sendUtterance(t); }

    // with zero events forever — bail out with an actionable hint instead.
    hearWatchdog = setTimeout(() => {
      if (!listening || heardSomething) return;
      try { rec.abort(); } catch {}
      endUi();
      if (state === 'listening') setState('standby');
      chatPanel.classList.add('open');
      toast('I couldn’t hear anything — check the mic isn’t muted and the right input device is selected (click the tune/lock icon by the address bar → Microphone), or type below instead.');
    }, 12000);
    try { rec.start(); }
    catch {
      endUi();

  function stopListening() { if (SpeechCapture.active) { SpeechCapture.stop(); return; } if (rec && listening) { try { rec.stop(); } catch {} } }

  let startingSpeech = false;
  async function startListening() {
    if (startingSpeech || listening || SpeechCapture.active) return;
    startingSpeech = true; stopSpeaking();
    try {
      const status = await MAX.speechStatus(true);
      if (!status.micEnabled) { flashMicProblem('Microphone is disabled in Privacy settings.'); return; }
      const cloud = status.stt.mode === 'cloud' && status.stt.configured;
      const why = micWhyNot(cloud);
      if (why) { flashMicProblem(why); chatPanel.classList.add('open'); return; }
      if (!cloud) { if (status.stt.mode === 'cloud') toast('Cloud transcription is not configured. Using browser recognition.'); startDeviceListening(); return; }
      if (wakeRec) { try { wakeRec.stop(); } catch {} wakeRec = null; }
      const end = () => { listening = false; micChip.classList.remove('on'); if (wakeOn && !wakeRec) setWake(true); };
      const result = await SpeechCapture.start({ deviceId: MAX.LS.get('microphone', ''),
        onStart: () => { listening = true; micChip.classList.add('on'); setState('listening', 'Listening. Tap again to send.'); },
        onStop: () => { listening = false; micChip.classList.remove('on'); setState('thinking', 'Transcribing…'); },
        onText: t => { end(); if(t.trim()){lastUserText=t;addBubble('me',t);setState('thinking');sendUtterance(t);}else setState('standby','No speech heard.'); },
        onError: error => { end(); flashMicProblem(error); chatPanel.classList.add('open'); }
      });
      if (!result.ok) { end(); flashMicProblem(result.reason); }
    } catch (error) { flashMicProblem(error.message); chatPanel.classList.add('open'); }

  }

  /* Wake word fallback: continuous recognition watching for "sight"/"hey sight" */
  async function setWake(on) {

    wakeOn = on;
    document.getElementById('wakeBtn').innerHTML = on ? 'Hey&nbsp;SIGHT&nbsp;●' : 'Hey&nbsp;SIGHT&nbsp;○';
    document.getElementById('wakeBtn').setAttribute('aria-pressed', on);
    if (!on) { Voice2.stopVAD(); if (wakeRec) { try { wakeRec.stop(); } catch {} wakeRec = null; } micChip.classList.remove('on'); return; }
    const wakeWhy = micWhyNot();
    if (wakeWhy) { toast(wakeWhy, wakeWhy === EMBED_MIC_MSG ? [{ label: 'Open full tab ↗', fn: openFullTab }] : null); return; }
    if (!Voice2.isListening) Voice2.startVAD().then(result => { if(!result.ok) toast(result.reason); });
    const loop = () => {
      if (!wakeOn || wakeRec || listening || SpeechCapture.active) return;
      wakeRec = new SR();
      const currentWake = wakeRec;
      wakeRec.continuous = true; wakeRec.interimResults = true;
      wakeRec.lang = MAX.LS.get('lang', 'en-US');
      wakeRec.onresult = (e) => {
        if(wakeRec !== currentWake) return;
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const said = e.results[i][0].transcript.toLowerCase();
          if (WakeWord.match(said).wake && (state === 'standby' || state === 'speaking')) {
            MAX.notify('SIGHT', 'Wake word heard');
            transcriptLine.textContent = '';
            try { wakeRec.stop(); } catch {}
            startListening();
            return;
          }
        }
      };
      wakeRec.onend = () => { if(wakeRec !== currentWake) return; wakeRec = null; micChip.classList.toggle('on', wakeOn); if (wakeOn && !listening) setTimeout(loop, 600); };
      wakeRec.onerror = () => {};
      try { wakeRec.start(); micChip.classList.add('on'); } catch {}
    };
    loop();
  }

  /* ---------- ring activation ---------- */
  ringWrap.addEventListener('click', () => {
    spawnRipple();
    if (state === 'listening') stopListening();
    else if (state === 'speaking') { MAX.stopSpeaking(); setState('standby'); }
    else if (state === 'alert') cancelSOS();
    else startListening();
  });

  /* ---------- voice verification (experimental, best-effort) ---------- */
  const verifyDrawer = document.getElementById('verifyDrawer');
  let mediaStream = null;

  async function captureVoiceFeatures(seconds = 2.2) {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micChip.classList.add('on');
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(mediaStream);
    const an = ac.createAnalyser(); an.fftSize = 2048;
    src.connect(an);
    const time = new Uint8Array(an.fftSize);
    const freq = new Uint8Array(an.frequencyBinCount);
    const samples = [];
    const t0 = performance.now();
    while (performance.now() - t0 < seconds * 1000) {
      await new Promise((r) => setTimeout(r, 90));
      an.getByteTimeDomainData(time);
      an.getByteFrequencyData(freq);
      let rms = 0, crossings = 0;
      for (let i = 0; i < time.length; i++) {
        const v = (time[i] - 128) / 128; rms += v * v;
        if (i && ((time[i - 1] < 128) !== (time[i] < 128))) crossings++;
      }
      rms = Math.sqrt(rms / time.length);
      const zcr = crossings / time.length;
      let num = 0, den = 0, low = 0, high = 0;
      for (let i = 0; i < freq.length; i++) {
        num += i * freq[i]; den += freq[i];
        if (i < freq.length * 0.125) low += freq[i]; else if (i > freq.length * 0.5) high += freq[i];
      }
      samples.push([rms, zcr * 10, den ? num / den / freq.length : 0, den ? low / den : 0, den ? high / den : 0]);
    }
    ac.close(); mediaStream.getTracks().forEach((t) => t.stop()); micChip.classList.remove('on');
    const avg = [0, 0, 0, 0, 0].map((_, i) => samples.reduce((s, x) => s + x[i], 0) / Math.max(1, samples.length));
    return avg.map((v) => Math.round(v * 1000) / 1000);
  }

  async function openVerify(line) {
    verifyDrawer.classList.add('open');
    speak(line || 'Please verify.', {});
    try {
      // liveness: fetch a fresh phrase the user must actually say out loud
      let ch = null;
      try { ch = await MAX.get('/api/voiceprint/challenge?user=' + encodeURIComponent(MAX.user())); } catch (e) {
        verifyDrawer.classList.remove('open');
        const msg = (e && e.message) || '';
        if (/locked/i.test(msg)) flashError('Voice verification is locked for a few minutes after repeated failures.');
        else if (/no voiceprint/i.test(msg)) flashError('No voiceprint enrolled — see Settings to enroll your voice first.');
        else flashError('Verification unavailable: ' + msg);
        pendingVerifyUtterance = null;
        return;
      }
      verifyText.innerHTML = 'To prove it’s really you, say: <b>' + ch.phrase.replace(/</g, '&lt;') + '</b>';
      speak('Please say: ' + ch.phrase, {});
      await new Promise((r) => setTimeout(r, 1300));

      // listen (for the spoken phrase) while sampling the voiceprint in parallel
      const SRv = window.SpeechRecognition || window.webkitSpeechRecognition;
      let spoken = '';
      let recog = null;
      if (SRv) {
        try {
          recog = new SRv();
          recog.lang = 'en-US'; recog.interimResults = true; recog.continuous = true;
          recog.onresult = (ev) => { for (let i = ev.resultIndex; i < ev.results.length; i++) spoken += ' ' + ev.results[i][0].transcript; };
          recog.start();
        } catch { recog = null; }
      }
      const features = await captureVoiceFeatures();
      if (recog) { try { recog.stop(); } catch {} }
      const res = await MAX.post('/api/voiceprint/verify', { user: MAX.user(), features, challengeId: ch.id, spoken: spoken.trim() });
      verifyText.textContent = 'This action is sensitive. Say your passphrase after the tone…';
      verifyDrawer.classList.remove('open');
      if (res.ok && res.token) {
        toast('Voice verified.');
        if (pendingVerifyTask) { const taskId=pendingVerifyTask; pendingVerifyTask=null; await MAX.post('/api/brain/jobs/'+taskId+'/verify',{user:MAX.user(),verifyToken:res.token}); location.href='tasks.html'; return; }
        if (pendingVerifyUtterance) { sendUtterance(pendingVerifyUtterance, { verifyToken: res.token }); pendingVerifyUtterance = null; }
      } else if (res.locked) {
        flashError('Verification is locked for ~' + Math.ceil((res.retryAfterSec || 900) / 60) + ' min.');
        pendingVerifyUtterance = null;
      } else if (res.spoken === false) {
        flashError('The phrase didn’t match — press the action again and say the exact words shown.');
        pendingVerifyUtterance = null;
      } else {
        flashError(res.error || 'Voice did not match closely enough.');
        pendingVerifyUtterance = null;
      }
    } catch (e) {
      verifyText.textContent = 'This action is sensitive. Say your passphrase after the tone…';
      verifyDrawer.classList.remove('open');
      flashMicProblem(inIframe() ? EMBED_MIC_MSG : 'Could not access the mic for verification.');
    }
  }
  document.getElementById('verifyCancel').onclick = () => { verifyDrawer.classList.remove('open'); pendingVerifyUtterance = null; setState('standby'); };

  /* ---------- vision: dedicated page ---------- */
  document.getElementById('visionBtn').onclick = () => { location.href = 'vision.html'; };

  /* ---------- SOS ---------- */
  async function triggerSOS() {
    setState('alert', 'Sending SOS…');
    alertActive = true;
    try {
      const res = await MAX.post('/api/sos', { user: MAX.user() });
      setState('alert', res.message);
      speak(res.message + ' Tap the ring to stand down.', {});
    } catch { flashError('SOS could not reach the hub.'); }
  }
  async function cancelSOS() { alertActive = false; try { await MAX.post('/api/utterance', { text: 'cancel the sos', user: MAX.user() }); } catch {} setState('standby', 'Standing down. Glad you’re safe.'); }
  document.getElementById('sosBtn').onclick = triggerSOS;

  /* ---------- dock ---------- */
  document.getElementById('wakeBtn').onclick = () => setWake(!wakeOn);
  /* HUD widget layer: easy to hide (persisted); the ring stays the focus. */
  const hudBtn = document.getElementById('hudBtn');
  function setHud(on) {
    document.body.classList.toggle('widgets-hidden', !on);
    MAX.LS.set('hud', on);
    hudBtn.innerHTML = on ? 'HUD&nbsp;●' : 'HUD&nbsp;○';
    hudBtn.setAttribute('aria-pressed', on);
  }
  hudBtn.onclick = () => setHud(document.body.classList.contains('widgets-hidden'));
  setHud(MAX.LS.get('hud', true));
  /* the widget layer is decorative — the page must NEVER depend on it. If
     js/widgets.js failed to load (e.g. hub offline + not yet SW-cached), an
     unguarded mountAll() would kill this whole script. */
  if (window.MAX && MAX.widgets && MAX.widgets.mountAll) {
    try { MAX.widgets.mountAll(); } catch { /* widgets optional — page continues */ }
  } else {
    const l = document.getElementById('hudLayer');
    if (l) l.style.display = 'none';
    hudBtn.style.display = 'none';
  }
  document.getElementById('typeBtn').onclick = () => {
    const open = chatPanel.classList.toggle('open');
    document.getElementById('typeBtn').setAttribute('aria-pressed', open);
    if (open) chatInput.focus();
  };
  if (MAX.LS.get('textOnly', false)) chatPanel.classList.add('open');

  /* proactive nudge on load (quiet, once) */
  MAX.get('/api/proactive').then((items) => {
    if (items && items.length && !sessionStorage.getItem('max.proactive')) {
      sessionStorage.setItem('max.proactive', '1');
      setTimeout(() => toast(items[0].text), 4000);
    }
  }).catch(() => {});

  connect();
  refreshNeeds();
  if(pendingVerifyTask) toast('A task needs identity verification.',[{label:'Verify now',fn:()=>openVerify('Please verify your identity, sir.')}]);
  /* periodic health recovery if WS is flaky */
  setInterval(() => { if (!wsOpen) MAX.get('/api/health').then(() => hubOnline(true)).catch(() => hubOnline(false)); }, 15000);

  /* PWA shortcut: index.html?sos=1 */
  if (new URLSearchParams(location.search).get('sos') === '1') setTimeout(triggerSOS, 800);
})();
</script>
